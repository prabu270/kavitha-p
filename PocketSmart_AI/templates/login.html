{% extends "base.html" %}

{% block title %}
Login · PocketSmart AI
{% endblock %}


{% block content %}

<div class="form-card">

    <h1>
        Welcome Back
    </h1>

    <p class="muted">
        Login to access your personalized
        recommendations.
    </p>


    <form id="loginForm">

        <label>
            Email

            <input
                name="email"
                type="email"
                placeholder="you@example.com"
                required
            >

        </label>


        <label>
            Password

            <input
                name="password"
                type="password"
                minlength="8"
                required
            >

        </label>


        <button
            class="btn"
            type="submit"
        >
            Login
        </button>


        <p
            id="message"
            class="error"
        ></p>

    </form>


    <p>

        Don't have an account?

        <a href="/register">
            Create one
        </a>

    </p>

</div>

{% endblock %}


{% block scripts %}

<script>

document
    .querySelector("#loginForm")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();

            const form =
                new FormData(event.target);

            const data =
                Object.fromEntries(form);

            const response =
                await api(
                    "/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(data)
                    }
                );

            const result =
                await response.json();

            if (response.ok) {

                window.location =
                    "/dashboard";

            } else {

                document
                    .querySelector("#message")
                    .textContent =
                    result.detail ||
                    "Login failed.";

            }

        }
    );

</script>

{% endblock %}
